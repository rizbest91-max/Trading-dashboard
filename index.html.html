<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Paper Trading Monitor</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0e17;
    color: #d6dde8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; color: #f1f4f8; margin: 0 0 2px; }
  .sub { color: #6b7688; font-size: 13px; margin-bottom: 16px; }
  .toolbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  button {
    background: #1a2233; color: #d6dde8; border: 1px solid #2a3450;
    padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #232d45; }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 12px; color: #566078; margin: 10px 0 18px; }
  .banner {
    background: #2a1f0d; border: 1px solid #6b4e17; color: #e0ac4c;
    padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #10151f; border: 1px solid #1e2635; border-radius: 10px; padding: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .coin-label { color: #6b7688; font-size: 13px; }
  .price { font-size: 20px; font-weight: 600; color: #f1f4f8; font-family: monospace; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 5px;
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .badge.up { background: #0e2a1e; color: #4ade8f; border: 1px solid #1e5c3d; }
  .badge.down { background: #2e1420; color: #f87189; border: 1px solid #6b1f39; }
  .badge.flat { background: #1a2233; color: #7c879c; border: 1px solid #2a3450; }
  .spark { width: 100%; height: 36px; margin: 10px 0; }
  .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
  .row .lbl { color: #566078; }
  .row .val { font-family: monospace; color: #d6dde8; }
  .pnl-pos { color: #4ade8f; }
  .pnl-neg { color: #f87189; }
  .balance-set { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  .balance-set input {
    width: 90px; background: #0a0e17; border: 1px solid #2a3450; color: #d6dde8;
    padding: 5px 7px; border-radius: 5px; font-size: 12px; font-family: monospace;
  }
  .balance-set button { padding: 5px 10px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .holding-line { font-size: 12px; color: #7c879c; margin-top: 6px; display: flex; align-items: center; }
  .log-card { background: #10151f; border: 1px solid #1e2635; border-radius: 10px; padding: 16px; }
  .log-card h2 { font-size: 14px; color: #b3bccb; margin: 0 0 10px; font-weight: 600; }
  .log-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #1a2130; }
  .log-row:last-child { border-bottom: none; }
  .buy { color: #4ade8f; font-weight: 600; }
  .sell { color: #f87189; font-weight: 600; }
  .empty { color: #566078; font-size: 13px; }
  .footnote { color: #3d4759; font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div>
      <h1>Paper Trading Monitor</h1>
      <div class="sub">SMA 10/30 crossover · live prices · no real money</div>
    </div>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div class="status" id="statusLine">Loading...</div>
  <div id="banner"></div>
  <div class="grid" id="cardGrid"></div>
  <div class="log-card">
    <h2>Simulated trade log</h2>
    <div id="log"></div>
  </div>
  <div class="footnote">Nothing here places a real order — it only simulates what the rule would have done. Data resets if you close this page.</div>
</div>

<script>
const COINS = [
  { symbol: "BTCUSDT", label: "Bitcoin", ticker: "BTC" },
  { symbol: "ETHUSDT", label: "Ethereum", ticker: "ETH" },
  { symbol: "SOLUSDT", label: "Solana", ticker: "SOL" },
];
const SHORT_WINDOW = 10;
const LONG_WINDOW = 30;
const REFRESH_MS = 60000;

const state = {};
COINS.forEach(c => {
  state[c.symbol] = {
    closes: [], times: [], price: null, signal: "HOLD",
    holding: false, entryPrice: null, startingBalance: 1000,
    balance: 1000, unitsHeld: 0, trades: [], error: null,
  };
});

function sma(values, window) {
  const out = new Array(values.length).fill(null);
  for (let i = window - 1; i < values.length; i++) {
    let sum = 0;
    for (let j = i - window + 1; j <= i; j++) sum += values[j];
    out[i] = sum / window;
  }
  return out;
}

function fmt(n, d = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
}

async function fetchCloses(symbol) {
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1h&limit=${LONG_WINDOW + 15}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const raw = await res.json();
  return { closes: raw.map(k => parseFloat(k[4])), times: raw.map(k => k[0]) };
}

function sparklineSVG(closes, color) {
  if (!closes.length) return "";
  const min = Math.min(...closes), max = Math.max(...closes);
  const range = max - min || 1;
  const w = 300, h = 36;
  const pts = closes.map((v, i) => {
    const x = (i / (closes.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" />
  </svg>`;
}

function resetCoin(symbol, newBalance) {
  const s = state[symbol];
  s.startingBalance = newBalance;
  s.balance = newBalance;
  s.unitsHeld = 0;
  s.holding = false;
  s.entryPrice = null;
  s.trades = [];
  render();
}

async function refresh() {
  document.getElementById("refreshBtn").disabled = true;
  let anySuccess = false, anyError = null;

  await Promise.all(COINS.map(async (c) => {
    const s = state[c.symbol];
    try {
      const { closes, times } = await fetchCloses(c.symbol);
      anySuccess = true;
      const shortArr = sma(closes, SHORT_WINDOW);
      const longArr = sma(closes, LONG_WINDOW);
      const i = closes.length - 1;
      const smaShort = shortArr[i], smaLong = longArr[i];
      const prevShort = shortArr[i - 1], prevLong = longArr[i - 1];
      const price = closes[i];

      let signal = "HOLD", crossedUp = false, crossedDown = false;
      if (smaShort !== null && smaLong !== null && prevShort !== null && prevLong !== null) {
        if (prevShort <= prevLong && smaShort > smaLong) crossedUp = true;
        if (prevShort >= prevLong && smaShort < smaLong) crossedDown = true;
        signal = smaShort > smaLong ? "BUY ZONE" : "SELL ZONE";
      }

      if (crossedUp && !s.holding) {
        s.unitsHeld = s.balance / price;
        s.balance = 0;
        s.holding = true;
        s.entryPrice = price;
        s.trades.unshift({ time: times[i], action: "BUY", price });
      } else if (crossedDown && s.holding) {
        s.balance = s.unitsHeld * price;
        s.unitsHeld = 0;
        s.holding = false;
        s.entryPrice = null;
        s.trades.unshift({ time: times[i], action: "SELL", price });
      }

      s.closes = closes; s.times = times; s.price = price; s.signal = signal; s.error = null;
      s.trades = s.trades.slice(0, 8);
    } catch (e) {
      anyError = e.message || "Fetch failed";
      s.error = anyError;
    }
  }));

  document.getElementById("banner").innerHTML = anySuccess ? "" :
    `<div class="banner">Live price fetch failed (${anyError}). Check your internet connection and reload this page.</div>`;
  document.getElementById("statusLine").textContent =
    "Last updated " + new Date().toLocaleTimeString() + " · auto-refresh every 60s";
  document.getElementById("refreshBtn").disabled = false;
  render();
}

function render() {
  const grid = document.getElementById("cardGrid");
  grid.innerHTML = COINS.map(c => {
    const s = state[c.symbol];
    const up = s.signal === "BUY ZONE", down = s.signal === "SELL ZONE";
    const color = up ? "#4ade8f" : down ? "#f87189" : "#7c879c";
    const badgeClass = up ? "up" : down ? "down" : "flat";
    const pnl = (s.holding && s.entryPrice && s.price) ? ((s.price - s.entryPrice) / s.entryPrice) * 100 : null;
    const currentValue = s.holding ? s.unitsHeld * (s.price || 0) : s.balance;
    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="coin-label">${c.label}</div>
            <div class="price">${s.price ? "$" + fmt(s.price, s.price > 100 ? 2 : 3) : "—"}</div>
          </div>
          <div class="badge ${badgeClass}">${s.signal}</div>
        </div>
        ${sparklineSVG(s.closes, color)}
        <div class="holding-line">
          <span class="dot" style="background:${s.holding ? '#4ade8f' : '#3d4759'}"></span>
          ${s.holding ? "Holding a simulated position" : "Sitting in cash"}
        </div>
        <div class="row"><span class="lbl">Paper value</span><span class="val">$${fmt(currentValue)}</span></div>
        <div class="row"><span class="lbl">Since entry</span><span class="val ${pnl === null ? '' : pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${pnl === null ? "—" : (pnl >= 0 ? "+" : "") + fmt(pnl, 2) + "%"}</span></div>
        <div class="balance-set">
          <input type="number" id="bal-${c.symbol}" placeholder="${s.startingBalance}" min="1" />
          <button onclick="applyBalance('${c.symbol}')">Set balance & reset</button>
        </div>
      </div>`;
  }).join("");

  const allTrades = COINS.flatMap(c => state[c.symbol].trades.map(t => ({ ...t, ticker: c.ticker })))
    .sort((a, b) => b.time - a.time).slice(0, 10);
  document.getElementById("log").innerHTML = allTrades.length ? allTrades.map(t => `
    <div class="log-row">
      <span>${new Date(t.time).toLocaleString()}</span>
      <span>${t.ticker}</span>
      <span class="${t.action === 'BUY' ? 'buy' : 'sell'}">${t.action}</span>
      <span>$${fmt(t.price)}</span>
    </div>`).join("") : `<div class="empty">No crossovers yet — the bot only acts when the short and long average cross.</div>`;
}

function applyBalance(symbol) {
  const input = document.getElementById("bal-" + symbol);
  const val = parseFloat(input.value);
  if (!val || val <= 0) { alert("Enter a positive number."); return; }
  resetCoin(symbol, val);
}

document.getElementById("refreshBtn").addEventListener("click", refresh);
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
